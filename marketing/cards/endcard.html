<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  .eyebrow { font-size: 30px; letter-spacing: 8px; }
  .rule    { width: 96px; height: 2px; margin: 46px 0 60px; }
  .hero    { font-size: 158px; letter-spacing: 1px; }
  .sub     { font-size: 50px; margin-top: 44px; max-width: 840px; line-height: 1.42; }
  /* On the end card the CTA is the ask, so it gets a bordered plate. */
  .plate {
    margin-top: 104px;
    border: 2px solid rgba(212,175,55,0.55);
    padding: 34px 62px;
  }
  .plate .cta   { font-size: 33px; letter-spacing: 5px; display: block; }
  .plate .domain{
    font-family: 'Cinzel', serif; font-size: 23px; letter-spacing: 3.4px;
    color: rgba(244,239,228,0.72); text-transform: uppercase;
    display: block; margin-top: 18px;
  }
</style></head>
<body><div class="stage">
  <div class="eyebrow">Bible Mood Search</div>
  <div class="rule"></div>
  <div class="hero">Meet David.</div>
  <div class="sub">A Bible companion that actually talks with you.</div>
  <div class="plate">
    <span class="cta">Talk to David free</span>
    <span class="domain">MyBibleAiCompanion.com</span>
  </div>
</div></body></html>
