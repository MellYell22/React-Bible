name: Finish pricing clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-pricing-clarity.yml'

permissions:
  contents: write

jobs:
  patch-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clarify direct upgrade pricing and benefits
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/finish-pricing.py
          python /tmp/finish-pricing.py

      - name: Commit finished pricing changes and remove this temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/finish-pricing-clarity.yml
          git config user.name "Bible Mood Search QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/ProfileScreen.tsx src/screens/VoiceScreen.tsx .github/workflows/finish-pricing-clarity.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "clarify pricing across subscription upgrade entry points"
          git push origin HEAD:main
